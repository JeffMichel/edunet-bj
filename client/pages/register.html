<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Élève — EduNet BJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/lucide.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/utils.js"></script>
</head>
<body class="bg-neutralBg font-sans text-neutralText min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-lg w-full space-y-8 bg-white p-8 rounded-2xl border border-neutralBorder shadow-lg">
        
        <!-- Header -->
        <div class="text-center">
            <h2 class="text-3xl font-extrabold text-primary">EduNet<span class="text-secondary">BJ</span></h2>
            <p class="mt-2 text-sm text-neutralMuted">
                Formulaire d'inscription élève (validation par l'administration requise)
            </p>
        </div>

        <!-- Form -->
        <form class="mt-8 space-y-4" id="registerForm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Nom -->
                <div>
                    <label for="nom" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Nom</label>
                    <input id="nom" name="nom" type="text" required 
                        class="appearance-none rounded-xl relative block w-full px-3 py-3 border border-neutralBorder placeholder-neutralMuted text-neutralText focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" 
                        placeholder="Ex: HOUESSOU">
                </div>
                <!-- Prénom -->
                <div>
                    <label for="prenom" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Prénom</label>
                    <input id="prenom" name="prenom" type="text" required 
                        class="appearance-none rounded-xl relative block w-full px-3 py-3 border border-neutralBorder placeholder-neutralMuted text-neutralText focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" 
                        placeholder="Ex: Koffi">
                </div>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Adresse Email</label>
                <input id="email" name="email" type="email" required 
                    class="appearance-none rounded-xl relative block w-full px-3 py-3 border border-neutralBorder placeholder-neutralMuted text-neutralText focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" 
                    placeholder="koffi.houessou@exemple.com">
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Mot de passe</label>
                <input id="password" name="password" type="password" required 
                    class="appearance-none rounded-xl relative block w-full px-3 py-3 border border-neutralBorder placeholder-neutralMuted text-neutralText focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" 
                    placeholder="Au moins 6 caractères">
            </div>

            <!-- Classe Select -->
            <div>
                <label for="classe" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Classe</label>
                <select id="classe" name="classe" required 
                    class="appearance-none rounded-xl relative block w-full px-3 py-3 border border-neutralBorder text-neutralText bg-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm">
                    <option value="" disabled selected>Sélectionnez votre classe</option>
                    <option value="6eme">6ème</option>
                    <option value="5eme">5ème</option>
                    <option value="4eme">4ème</option>
                    <option value="3eme">3ème</option>
                    <option value="2nde">Seconde</option>
                    <option value="1ere">Première</option>
                    <option value="Tle">Terminale</option>
                </select>
            </div>

            <!-- Submit Button -->
            <div class="pt-4">
                <button type="submit" id="submitBtn"
                    class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-secondary hover:bg-secondary-light focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-all duration-200">
                    S'inscrire
                </button>
            </div>
        </form>

        <!-- Redirect to login -->
        <div class="text-center mt-4">
            <p class="text-sm text-neutralMuted">
                Déjà inscrit ? 
                <a href="login.html" class="font-semibold text-primary hover:text-primary-light">
                    Se connecter
                </a>
            </p>
            <div class="mt-4 border-t border-neutralBorder pt-4">
                <a href="../index.html" class="text-xs text-neutralMuted inline-flex items-center gap-1 hover:text-primary">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Retour à l'accueil
                </a>
            </div>
        </div>

    </div>

    <script>
        // Initialiser les icônes
        lucide.createIcons();

        // Gérer l'inscription
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nom = document.getElementById('nom').value.trim();
            const prenom = document.getElementById('prenom').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const classe = document.getElementById('classe').value;
            const submitBtn = document.getElementById('submitBtn');

            if (!nom || !prenom || !email || !password || !classe) {
                Utils.showToast("Veuillez remplir tous les champs.", "error");
                return;
            }

            if (password.length < 6) {
                Utils.showToast("Le mot de passe doit faire au moins 6 caractères.", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = "Inscription en cours...";

            const response = await API.postData('/auth/register', { nom, prenom, email, password, classe });

            if (response.success) {
                Utils.showToast(response.message, "success");
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } else {
                Utils.showToast(response.message, "error");
                submitBtn.disabled = false;
                submitBtn.innerHTML = "S'inscrire";
            }
        });
    </script>
</body>
</html>
