<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gérer les Cours — EduNet BJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/lucide.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/utils.js"></script>
</head>
<body class="bg-neutralBg font-sans text-neutralText antialiased flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-primary-dark text-white flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="h-16 flex items-center px-6 border-b border-white/10">
                <span class="text-xl font-bold text-white">EduNet<span class="text-secondary">BJ</span></span>
            </div>
            
            <div class="px-6 py-6 border-b border-white/10 flex items-center gap-3">
                <div id="userAvatarContainer" class="w-10 h-10 rounded-full bg-secondary flex items-center justify-center font-bold text-white uppercase text-sm"></div>
                <div>
                    <h4 id="userName" class="font-semibold text-sm truncate">Chargement...</h4>
                    <span id="userMatiere" class="text-xs text-white/60">Enseignant</span>
                </div>
            </div>

            <nav class="p-4 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </a>
                <a href="courses.html" class="flex items-center gap-3 px-4 py-3 bg-secondary text-white rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Cours
                </a>
                <a href="assignments.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="clipboard-list" class="w-4 h-4"></i> Devoirs
                </a>
                <a href="grades.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="award" class="w-4 h-4"></i> Saisie des Notes
                </a>
                <a href="announcements.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="megaphone" class="w-4 h-4"></i> Annonces
                </a>
                <a href="messaging.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="message-square" class="w-4 h-4"></i> Messagerie
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-white/10">
            <button onclick="Auth.logout()" class="flex items-center gap-3 w-full px-4 py-3 text-white/60 hover:text-error hover:bg-red-500/10 rounded-lg text-sm font-semibold transition-all duration-200">
                <i data-lucide="log-out" class="w-4 h-4"></i> Se déconnecter
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <header class="h-16 bg-white border-b border-neutralBorder flex items-center justify-between px-6 shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold">Gestion des Supports de Cours</h1>
            </div>
            <button onclick="openPublishModal()" class="px-4 py-2 bg-primary hover:bg-primary-light text-white font-semibold rounded-lg text-xs flex items-center gap-1.5 shadow transition-all">
                <i data-lucide="plus" class="w-4 h-4"></i> Publier un cours PDF
            </button>
        </header>

        <div class="p-6 max-w-7xl w-full mx-auto space-y-6">
            
            <!-- Published courses list -->
            <div class="bg-white rounded-2xl border border-neutralBorder p-6 shadow-sm">
                <h3 class="font-bold text-base text-neutralText mb-6 flex items-center gap-2">
                    <i data-lucide="folder-open" class="text-primary w-5 h-5"></i> Mes cours publiés
                </h3>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-neutralBorder text-neutralMuted uppercase text-xs font-semibold">
                                <th class="py-3 px-4">Titre</th>
                                <th class="py-3 px-4">Classe</th>
                                <th class="py-3 px-4">Matière</th>
                                <th class="py-3 px-4">Date de publication</th>
                                <th class="py-3 px-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="coursesTableBody">
                            <tr>
                                <td colspan="5" class="text-center py-8 text-neutralMuted">Chargement de la liste des cours...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Publish Course Modal -->
    <div id="publishModal" class="fixed inset-0 bg-neutralText/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white w-full max-w-md p-6 rounded-2xl border border-neutralBorder shadow-xl relative animate-scale-up">
            <button onclick="closePublishModal()" class="absolute top-4 right-4 text-neutralMuted hover:text-neutralText">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="text-lg font-bold text-primary mb-6 flex items-center gap-2">
                <i data-lucide="plus-circle"></i> Publier un nouveau cours
            </h3>

            <form id="publishForm" class="space-y-4">
                <div>
                    <label for="courseTitle" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Titre du cours</label>
                    <input id="courseTitle" name="titre" type="text" required 
                        class="appearance-none rounded-xl relative block w-full px-3 py-3 border border-neutralBorder placeholder-neutralMuted text-neutralText focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" 
                        placeholder="Ex: Chapitre 1 - Équations du second degré">
                </div>

                <div>
                    <label for="courseDescription" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Description</label>
                    <textarea id="courseDescription" name="description" rows="3"
                        class="appearance-none rounded-xl relative block w-full px-3 py-3 border border-neutralBorder placeholder-neutralMuted text-neutralText focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" 
                        placeholder="Brève description des notions abordées..."></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="courseClasse" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Classe cible</label>
                        <select id="courseClasse" name="classe" required 
                            class="appearance-none rounded-xl relative block w-full px-3 py-3 border border-neutralBorder text-neutralText bg-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm">
                            <option value="" disabled selected>Sélectionner</option>
                            <option value="6eme">6ème</option>
                            <option value="5eme">5ème</option>
                            <option value="4eme">4ème</option>
                            <option value="3eme">3ème</option>
                            <option value="2nde">Seconde</option>
                            <option value="1ere">Première</option>
                            <option value="Tle">Terminale</option>
                        </select>
                    </div>
                    <div>
                        <label for="courseMatiere" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Matière</label>
                        <input id="courseMatiere" name="matiere" type="text" required readonly
                            class="appearance-none rounded-xl relative block w-full px-3 py-3 border border-neutralBorder text-neutralMuted bg-neutralBg text-sm focus:outline-none">
                    </div>
                </div>

                <div>
                    <label for="courseFile" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Fichier de cours (PDF uniquement, max 5 Mo)</label>
                    <div class="border border-dashed border-neutralBorder hover:border-primary rounded-xl p-6 text-center cursor-pointer transition-all relative">
                        <input type="file" id="courseFile" name="fichier" accept="application/pdf" required 
                            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <div class="flex flex-col items-center">
                            <i data-lucide="file" class="w-6 h-6 text-neutralMuted mb-1"></i>
                            <span id="fileNameDisplay" class="text-xs font-medium text-neutralText">Choisir un fichier PDF</span>
                        </div>
                    </div>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closePublishModal()" class="flex-1 py-3 px-4 bg-neutralBg hover:bg-neutralBorder text-neutralText font-semibold rounded-xl text-sm transition-all">
                        Annuler
                    </button>
                    <button type="submit" id="submitBtn" class="flex-1 py-3 px-4 bg-primary hover:bg-primary-light text-white font-semibold rounded-xl text-sm transition-all">
                        Publier
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const currentUser = Auth.checkSession(['enseignant']);

        if (currentUser) {
            document.getElementById('userName').innerText = `${currentUser.prenom} ${currentUser.nom}`;
            document.getElementById('userMatiere').innerText = `Enseignant de ${currentUser.matiere}`;
            document.getElementById('courseMatiere').value = currentUser.matiere;

            const initials = (currentUser.prenom[0] + currentUser.nom[0]).toUpperCase();
            document.getElementById('userAvatarContainer').innerText = initials;

            loadCourses();
        }

        // File upload label change handler
        document.getElementById('courseFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileNameDisplay').innerText = file.name;
            }
        });

        // Get courses list and load into table
        async function loadCourses() {
            const tbody = document.getElementById('coursesTableBody');
            const res = await API.get('/courses');
            
            if (res.success) {
                // Filtrer par enseignant connecté
                const myCourses = res.data.filter(c => c.enseignant_id === currentUser.id);

                if (myCourses.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center py-8 text-neutralMuted">Vous n'avez publié aucun support de cours pour le moment.</td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = '';
                myCourses.forEach(c => {
                    const pdfLink = window.location.origin + '/' + c.fichier_url;
                    
                    tbody.innerHTML += `
                        <tr class="border-b border-neutralBorder hover:bg-neutralBg/20 transition-all">
                            <td class="py-4 px-4 font-bold text-neutralText">
                                <a href="${pdfLink}" target="_blank" class="hover:underline flex items-center gap-1.5">
                                    <i data-lucide="file-text" class="w-4 h-4 text-red-500 shrink-0"></i>
                                    ${Utils.escapeHTML(c.titre)}
                                </a>
                            </td>
                            <td class="py-4 px-4 uppercase font-semibold text-neutralText">${c.classe}</td>
                            <td class="py-4 px-4 text-neutralMuted">${Utils.escapeHTML(c.matiere)}</td>
                            <td class="py-4 px-4 text-neutralMuted">${Utils.formatDate(c.created_at, false)}</td>
                            <td class="py-4 px-4 text-right">
                                <button onclick="deleteCourse(${c.id})" class="p-1.5 hover:bg-red-50 text-error rounded-lg transition-all" title="Supprimer">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                lucide.createIcons();
            } else {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-8 text-error font-medium">${res.message}</td>
                    </tr>
                `;
            }
        }

        // Delete Course
        async function deleteCourse(id) {
            if (!confirm("Voulez-vous vraiment supprimer ce cours ? Cette action supprimera définitivement le fichier PDF associé.")) {
                return;
            }

            const res = await API.delete(`/courses/${id}`);
            if (res.success) {
                Utils.showToast("Cours supprimé avec succès.", "success");
                loadCourses();
            } else {
                Utils.showToast(res.message, "error");
            }
        }

        // Publish Form Submit handler
        document.getElementById('publishForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const titre = document.getElementById('courseTitle').value.trim();
            const description = document.getElementById('courseDescription').value.trim();
            const classe = document.getElementById('courseClasse').value;
            const fileInput = document.getElementById('courseFile');
            const submitBtn = document.getElementById('submitBtn');

            if (!titre || !classe || fileInput.files.length === 0) {
                Utils.showToast("Veuillez remplir tous les champs obligatoires et choisir un fichier.", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Téléversement...";

            // FormData
            const formData = new FormData();
            formData.append('titre', titre);
            formData.append('description', description);
            formData.append('classe', classe);
            formData.append('matiere', currentUser.matiere);
            formData.append('fichier', fileInput.files[0]);

            const res = await API.postData('/courses', formData);

            if (res.success) {
                Utils.showToast("Cours publié avec succès !", "success");
                closePublishModal();
                document.getElementById('publishForm').reset();
                loadCourses();
            } else {
                Utils.showToast(res.message, "error");
            }
            submitBtn.disabled = false;
            submitBtn.innerText = "Publier";
        });

        // Modals management
        function openPublishModal() {
            document.getElementById('fileNameDisplay').innerText = "Choisir un fichier PDF";
            document.getElementById('publishForm').reset();
            document.getElementById('courseMatiere').value = currentUser.matiere;
            document.getElementById('publishModal').classList.remove('hidden');
        }
        function closePublishModal() {
            document.getElementById('publishModal').classList.add('hidden');
        }
    </script>
</body>
</html>
