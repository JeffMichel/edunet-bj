<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Notes — EduNet BJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/lucide.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/utils.js"></script>
</head>
<body class="bg-neutralBg font-sans text-neutralText antialiased flex min-h-screen">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-primary-dark text-white flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <!-- Logo -->
            <div class="h-16 flex items-center px-6 border-b border-white/10">
                <span class="text-xl font-bold text-white">EduNet<span class="text-secondary">BJ</span></span>
            </div>
            
            <!-- User Summary -->
            <div class="px-6 py-6 border-b border-white/10 flex items-center gap-3">
                <div id="userAvatarContainer" class="w-10 h-10 rounded-full bg-secondary flex items-center justify-center font-bold text-white uppercase text-sm">
                    <!-- Initials dynamically loaded -->
                </div>
                <div>
                    <h4 id="userName" class="font-semibold text-sm truncate">Chargement...</h4>
                    <span id="userClass" class="text-xs text-white/60">Élève</span>
                </div>
            </div>

            <!-- Nav Items -->
            <nav class="p-4 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </a>
                <a href="courses.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Cours
                </a>
                <a href="assignments.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="clipboard-list" class="w-4 h-4"></i> Devoirs
                </a>
                <a href="announcements.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="megaphone" class="w-4 h-4"></i> Annonces
                </a>
                <a href="messaging.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="message-square" class="w-4 h-4"></i> Messagerie
                </a>
                <a href="schedule.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="calendar" class="w-4 h-4"></i> Emploi du temps
                </a>
                <a href="grades.html" class="flex items-center gap-3 px-4 py-3 bg-secondary text-white rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="award" class="w-4 h-4"></i> Mes notes
                </a>
            </nav>
        </div>

        <!-- Logout -->
        <div class="p-4 border-t border-white/10">
            <button onclick="Auth.logout()" class="flex items-center gap-3 w-full px-4 py-3 text-white/60 hover:text-error hover:bg-red-500/10 rounded-lg text-sm font-semibold transition-all duration-200">
                <i data-lucide="log-out" class="w-4 h-4"></i> Se déconnecter
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <header class="h-16 bg-white border-b border-neutralBorder flex items-center justify-between px-6 shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold">Mes Notes scolaires</h1>
            </div>
            <div>
                <span id="userBadge" class="px-2.5 py-1 bg-blue-50 text-primary rounded-full text-xs font-semibold uppercase">Classe</span>
            </div>
        </header>

        <div class="p-6 max-w-5xl w-full mx-auto space-y-6">
            <!-- Header Filter Section -->
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-neutralMuted text-sm">Résultats scolaires par matière et par trimestre</p>
                </div>
                <!-- Trimestre filter -->
                <div class="flex items-center gap-2">
                    <label class="text-sm text-neutralMuted">Trimestre :</label>
                    <select id="trimestreFilter" class="border border-neutralBorder rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="">Tous</option>
                        <option value="1">1er trimestre</option>
                        <option value="2">2ème trimestre</option>
                        <option value="3">3ème trimestre</option>
                    </select>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="summaryCards">
                <!-- Loaded dynamically -->
            </div>

            <!-- Notes by subject -->
            <div id="notesBySubject" class="space-y-4">
                <div class="text-center py-16 text-neutralMuted bg-white rounded-2xl border border-neutralBorder">
                    <i data-lucide="loader" class="w-10 h-10 mx-auto mb-3 opacity-40 animate-spin"></i>
                    <p>Chargement des notes...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Session Check
        const user = Auth.checkSession(['eleve']);
        let allGrades = [];

        if (user) {
            document.getElementById('userName').textContent = `${user.prenom} ${user.nom}`;
            document.getElementById('userClass').textContent = `Élève · ${user.classe.toUpperCase()}`;
            document.getElementById('userBadge').textContent = user.classe;

            const initials = (user.prenom[0] + user.nom[0]).toUpperCase();
            document.getElementById('userAvatarContainer').innerText = initials;

            loadGrades();
        }

        function getNoteBadge(note) {
            if (note >= 16) return { color: 'text-green-700 bg-green-50 border-green-200', label: 'Excellent' };
            if (note >= 14) return { color: 'text-blue-700 bg-blue-50 border-blue-200', label: 'Bien' };
            if (note >= 12) return { color: 'text-yellow-700 bg-yellow-50 border-yellow-200', label: 'Assez bien' };
            if (note >= 10) return { color: 'text-orange-700 bg-orange-50 border-orange-200', label: 'Passable' };
            return { color: 'text-red-700 bg-red-50 border-red-200', label: 'Insuffisant' };
        }

        function renderGrades(grades) {
            const container = document.getElementById('notesBySubject');
            
            if (grades.length === 0) {
                container.innerHTML = `<div class="text-center py-16 bg-white rounded-2xl border border-neutralBorder">
                    <i data-lucide="bar-chart-2" class="w-16 h-16 mx-auto mb-4 text-neutralMuted opacity-30"></i>
                    <h3 class="text-lg font-semibold text-neutralText mb-2">Aucune note disponible</h3>
                    <p class="text-neutralMuted text-sm">Vos notes apparaîtront ici lorsque vos enseignants les auront saisies.</p>
                </div>`;
                lucide.createIcons();
                return;
            }

            // Group by subject
            const bySubject = {};
            grades.forEach(g => {
                if (!bySubject[g.matiere]) bySubject[g.matiere] = [];
                bySubject[g.matiere].push(g);
            });

            // Summary
            const avg = grades.reduce((s, g) => s + parseFloat(g.note), 0) / grades.length;
            const best = Math.max(...grades.map(g => parseFloat(g.note)));
            const worst = Math.min(...grades.map(g => parseFloat(g.note)));

            document.getElementById('summaryCards').innerHTML = `
                <div class="bg-white rounded-2xl border border-neutralBorder p-5 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center">
                        <i data-lucide="bar-chart" class="w-6 h-6 text-primary"></i>
                    </div>
                    <div>
                        <p class="text-xs text-neutralMuted">Moyenne générale</p>
                        <p class="text-xl font-bold text-neutralText">${avg.toFixed(2)}<span class="text-xs font-normal text-neutralMuted">/20</span></p>
                    </div>
                </div>
                <div class="bg-white rounded-2xl border border-neutralBorder p-5 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-green-100 flex items-center justify-center">
                        <i data-lucide="trending-up" class="w-6 h-6 text-green-600"></i>
                    </div>
                    <div>
                        <p class="text-xs text-neutralMuted">Meilleure note</p>
                        <p class="text-xl font-bold text-green-600">${best}<span class="text-xs font-normal text-neutralMuted">/20</span></p>
                    </div>
                </div>
                <div class="bg-white rounded-2xl border border-neutralBorder p-5 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-red-100 flex items-center justify-center">
                        <i data-lucide="trending-down" class="w-6 h-6 text-red-500"></i>
                    </div>
                    <div>
                        <p class="text-xs text-neutralMuted">Note la plus basse</p>
                        <p class="text-xl font-bold text-red-500">${worst}<span class="text-xs font-normal text-neutralMuted">/20</span></p>
                    </div>
                </div>`;

            // Render by subject
            container.innerHTML = Object.entries(bySubject).map(([matiere, notes]) => {
                const subAvg = notes.reduce((s, n) => s + parseFloat(n.note), 0) / notes.length;
                const badge = getNoteBadge(subAvg);
                
                return `<div class="bg-white rounded-2xl border border-neutralBorder shadow-sm overflow-hidden">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-neutralBorder">
                        <div class="flex items-center gap-3">
                            <div class="w-1.5 h-6 rounded-full bg-primary"></div>
                            <h3 class="font-bold text-sm text-neutralText">${matiere}</h3>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-neutralMuted">${notes.length} note(s)</span>
                            <span class="text-base font-bold text-primary">${subAvg.toFixed(2)}/20</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full border font-medium ${badge.color}">${badge.label}</span>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-neutralBg">
                                <tr>
                                    <th class="text-left px-6 py-3 text-xs font-semibold text-neutralMuted uppercase">Trimestre</th>
                                    <th class="text-left px-6 py-3 text-xs font-semibold text-neutralMuted uppercase">Année</th>
                                    <th class="text-center px-6 py-3 text-xs font-semibold text-neutralMuted uppercase">Note /20</th>
                                    <th class="text-left px-6 py-3 text-xs font-semibold text-neutralMuted uppercase">Appréciation</th>
                                    <th class="text-left px-6 py-3 text-xs font-semibold text-neutralMuted uppercase">Enseignant</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-neutralBorder">
                                ${notes.map(n => {
                                    const nb = getNoteBadge(parseFloat(n.note));
                                    return `<tr class="hover:bg-neutralBg/50 transition-colors">
                                        <td class="px-6 py-3 text-sm">T${n.trimestre}</td>
                                        <td class="px-6 py-3 text-sm text-neutralMuted">${n.annee_scolaire}</td>
                                        <td class="px-6 py-3 text-center">
                                            <span class="inline-block px-3 py-1 rounded-full text-sm font-bold border ${nb.color}">${n.note}</span>
                                        </td>
                                        <td class="px-6 py-3 text-sm text-neutralMuted">${n.appreciation || '—'}</td>
                                        <td class="px-6 py-3 text-sm">${n.enseignant_prenom || ''} ${n.enseignant_nom || ''}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            }).join('');

            lucide.createIcons();
        }

        async function loadGrades() {
            const res = await API.get('/grades/me');
            if (res.success) {
                allGrades = res.data || [];
                renderGrades(allGrades);
            }
        }

        document.getElementById('trimestreFilter').addEventListener('change', (e) => {
            const val = e.target.value;
            const filtered = val ? allGrades.filter(g => g.trimestre === val) : allGrades;
            renderGrades(filtered);
        });
    </script>
</body>
</html>
