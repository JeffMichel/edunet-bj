<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annonces — EduNet BJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/lucide.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/utils.js"></script>
</head>
<body class="bg-neutralBg font-sans text-neutralText antialiased flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-primary-dark text-white flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="h-16 flex items-center px-6 border-b border-white/10">
                <span class="text-xl font-bold text-white">EduNet<span class="text-secondary">BJ</span></span>
            </div>
            
            <div class="px-6 py-6 border-b border-white/10 flex items-center gap-3">
                <div id="userAvatarContainer" class="w-10 h-10 rounded-full bg-secondary flex items-center justify-center font-bold text-white uppercase text-sm"></div>
                <div>
                    <h4 id="userName" class="font-semibold text-sm truncate">Chargement...</h4>
                    <span id="userClass" class="text-xs text-white/60">Élève</span>
                </div>
            </div>

            <nav class="p-4 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </a>
                <a href="courses.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Cours
                </a>
                <a href="assignments.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="clipboard-list" class="w-4 h-4"></i> Devoirs
                </a>
                <a href="announcements.html" class="flex items-center gap-3 px-4 py-3 bg-secondary text-white rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="megaphone" class="w-4 h-4"></i> Annonces
                </a>
                <a href="messaging.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="message-square" class="w-4 h-4"></i> Messagerie
                </a>
                <a href="schedule.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="calendar" class="w-4 h-4"></i> Emploi du temps
                </a>
                <a href="grades.html" class="flex items-center gap-3 px-4 py-3 text-white/60 hover:text-white hover:bg-white/5 rounded-lg text-sm font-semibold transition-all duration-200">
                    <i data-lucide="award" class="w-4 h-4"></i> Mes notes
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-white/10">
            <button onclick="Auth.logout()" class="flex items-center gap-3 w-full px-4 py-3 text-white/60 hover:text-error hover:bg-red-500/10 rounded-lg text-sm font-semibold transition-all duration-200">
                <i data-lucide="log-out" class="w-4 h-4"></i> Se déconnecter
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <header class="h-16 bg-white border-b border-neutralBorder flex items-center justify-between px-6 shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold">Annonces & Communiqués</h1>
            </div>
            <div>
                <span id="userBadge" class="px-2.5 py-1 bg-blue-50 text-primary rounded-full text-xs font-semibold uppercase">Classe</span>
            </div>
        </header>

        <div class="p-6 max-w-3xl w-full mx-auto space-y-6">
            
            <!-- Feed Container -->
            <div id="announcementsFeed" class="space-y-6">
                <p class="text-neutralMuted text-sm text-center py-12">Chargement des communiqués de l'établissement...</p>
            </div>

        </div>
    </main>

    <script>
        // Session Check
        const currentUser = Auth.checkSession(['eleve']);

        if (currentUser) {
            document.getElementById('userName').innerText = `${currentUser.prenom} ${currentUser.nom}`;
            document.getElementById('userClass').innerText = `Élève · ${currentUser.classe.toUpperCase()}`;
            document.getElementById('userBadge').innerText = currentUser.classe;

            const initials = (currentUser.prenom[0] + currentUser.nom[0]).toUpperCase();
            document.getElementById('userAvatarContainer').innerText = initials;

            loadAnnouncements();
        }

        // Fetch announcements
        async function loadAnnouncements() {
            const feed = document.getElementById('announcementsFeed');
            const res = await API.get('/announcements');
            
            if (res.success) {
                if (res.data.length === 0) {
                    feed.innerHTML = `
                        <div class="bg-white p-8 rounded-2xl border border-neutralBorder text-center shadow-sm">
                            <i data-lucide="megaphone-off" class="w-12 h-12 text-neutralMuted mx-auto mb-4"></i>
                            <h3 class="font-bold text-base">Aucun communiqué</h3>
                            <p class="text-xs text-neutralMuted mt-1">Aucune annonce n'a été publiée pour votre classe.</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                feed.innerHTML = '';
                res.data.forEach(ann => {
                    const avatarText = (ann.auteur_prenom[0] + ann.auteur_nom[0]).toUpperCase();
                    const isGlobal = !ann.classe_cible;
                    const scopeBadgeClass = isGlobal ? 'bg-primary/10 text-primary' : 'bg-secondary/10 text-secondary';
                    const scopeBadgeText = isGlobal ? 'Général' : `Classe: ${ann.classe_cible.toUpperCase()}`;

                    feed.innerHTML += `
                        <div class="bg-white rounded-2xl border border-neutralBorder shadow-sm p-6 space-y-4">
                            <div class="flex items-center justify-between border-b border-neutralBorder pb-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-neutralBg border border-neutralBorder flex items-center justify-center font-bold text-xs uppercase text-neutralText shrink-0">
                                        ${avatarText}
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-sm">${Utils.escapeHTML(ann.auteur_prenom)} ${Utils.escapeHTML(ann.auteur_nom)}</h4>
                                        <p class="text-[10px] text-neutralMuted">Publié le ${Utils.formatDate(ann.created_at)}</p>
                                    </div>
                                </div>
                                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${scopeBadgeClass}">
                                    ${scopeBadgeText}
                                </span>
                            </div>
                            <div>
                                <h3 class="font-bold text-base text-neutralText">${Utils.escapeHTML(ann.titre)}</h3>
                                <p class="text-xs text-neutralMuted mt-2 whitespace-pre-wrap leading-relaxed">${Utils.escapeHTML(ann.contenu)}</p>
                            </div>
                        </div>
                    `;
                });
                lucide.createIcons();
            } else {
                feed.innerHTML = `
                    <p class="text-error text-sm text-center py-12">${res.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
