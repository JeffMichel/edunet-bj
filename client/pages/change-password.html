<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changement de mot de passe obligatoire — EduNet BJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/lucide.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/utils.js"></script>
</head>
<body class="bg-neutralBg font-sans text-neutralText min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl border border-neutralBorder shadow-lg">
        
        <!-- Header -->
        <div class="text-center">
            <h2 class="text-3xl font-extrabold text-primary">EduNet<span class="text-secondary">BJ</span></h2>
            <h3 class="text-lg font-bold text-neutralText mt-4">Sécurisation de votre compte</h3>
            <p class="mt-2 text-xs text-neutralMuted leading-relaxed">
                C'est votre première connexion ! Pour des raisons de sécurité, vous devez remplacer le mot de passe par défaut par un mot de passe personnel avant de continuer.
            </p>
        </div>

        <!-- Form -->
        <form class="mt-6 space-y-6" id="changePasswordForm">
            <div class="space-y-4">
                <!-- New Password -->
                <div>
                    <label for="newPassword" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Nouveau mot de passe</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-neutralMuted">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </div>
                        <input id="newPassword" name="new_password" type="password" required 
                            class="appearance-none rounded-xl relative block w-full pl-10 pr-3 py-3 border border-neutralBorder placeholder-neutralMuted text-neutralText focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" 
                            placeholder="Au moins 6 caractères">
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirmPassword" class="block text-xs font-semibold uppercase tracking-wider text-neutralMuted mb-2">Confirmer le mot de passe</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-neutralMuted">
                            <i data-lucide="shield-check" class="w-5 h-5"></i>
                        </div>
                        <input id="confirmPassword" name="confirm_password" type="password" required 
                            class="appearance-none rounded-xl relative block w-full pl-10 pr-3 py-3 border border-neutralBorder placeholder-neutralMuted text-neutralText focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" 
                            placeholder="Saisissez à nouveau le mot de passe">
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit" id="submitBtn"
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-secondary hover:bg-secondary-light focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 shadow-lg shadow-secondary/20 hover:shadow-secondary/30">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i data-lucide="check" class="w-5 h-5 opacity-50 group-hover:opacity-100 transition-opacity"></i>
                    </span>
                    Valider le mot de passe
                </button>
            </div>
        </form>

        <div class="text-center mt-4 border-t border-neutralBorder pt-4">
            <button onclick="Auth.logout()" class="text-xs text-error font-semibold hover:underline inline-flex items-center gap-1">
                <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Annuler et se déconnecter
            </button>
        </div>

    </div>

    <script>
        // Initialiser les icônes Lucide
        lucide.createIcons();

        // S'assurer que l'utilisateur est authentifié
        const currentUser = Auth.checkSession();

        // Gérer le formulaire
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            if (!newPassword || !confirmPassword) {
                Utils.showToast("Veuillez remplir tous les champs.", "error");
                return;
            }

            if (newPassword.length < 6) {
                Utils.showToast("Le mot de passe doit contenir au moins 6 caractères.", "error");
                return;
            }

            if (newPassword === '000000') {
                Utils.showToast("Le mot de passe ne peut pas être '000000'.", "error");
                return;
            }

            if (newPassword !== confirmPassword) {
                Utils.showToast("Les deux mots de passe ne correspondent pas.", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = "Modification...";

            const res = await API.postData('/auth/change-password', {
                new_password: newPassword,
                confirm_password: confirmPassword
            });

            if (res.success) {
                Utils.showToast("Mot de passe modifié avec succès !", "success");
                
                // Mettre à jour la session locale (premier_connexion passe à 0)
                const user = API.getUser();
                user.premier_connexion = 0;
                API.setSession(null, null, user);

                // Rediriger vers son tableau de bord après 1 seconde
                setTimeout(() => {
                    Auth.redirectToDashboard(user.role);
                }, 1000);
            } else {
                Utils.showToast(res.message, "error");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i data-lucide="check" class="w-5 h-5 opacity-50"></i>
                    </span>
                    Valider le mot de passe
                `;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
